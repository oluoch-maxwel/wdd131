<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <meta name="description"
        content="WDD 131 - Dynamic Web Fundamentals. Learn HTML, CSS, JavaScript, responsive web design, and dynamic web development concepts.">

    <meta name="author" content="OLUOCH OCHIENG">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>


</head>

<body>
    <div class="container">


        <header>
            <span>Product Review</span>
        </header>

        <main>

            <form method="get" action="review.html" class="form">

                <!-- Product Name -->
                <div class="select">
                    <label for="productName">Product Name</label>

                    <select name="productName" id="productName" required>
                        <option value="" disabled selected>Select a Product</option>
                    </select>
                </div>


                <!-- Overall Rating -->
                <div class="rating">
                    <div>Overall Rating</div>

                    <div class="label-rating">

                        <div>
                            <label for="rating1">⭐</label>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </div>

                        <div>
                            <label for="rating2">⭐⭐</label>
                            <input type="radio" id="rating2" name="rating" value="2" required>
                        </div>

                        <div>
                            <label for="rating3">⭐⭐⭐</label>
                            <input type="radio" id="rating3" name="rating" value="3" required>
                        </div>

                        <div>
                            <label for="rating4">⭐⭐⭐⭐</label>
                            <input type="radio" id="rating4" name="rating" value="4" required>
                        </div>

                        <div>
                            <label for="rating5">⭐⭐⭐⭐⭐</label>
                            <input type="radio" id="rating5" name="rating" value="5" required>
                        </div>

                    </div>
                </div>


                <!-- Date -->
                <div class="date">
                    <label for="date">Date of Review</label>

                    <input type="date" name="date" id="date" required>
                </div>


                <!-- Useful Features -->
                <div class="checkbox">



                    <div>
                        Which product features did you find useful?
                        <br>
                        <i>(Check all that apply)</i>
                    </div>

                    <div class="check-box">

                        <label for="durability">
                            <input type="checkbox" id="durability" name="features" value="durability">
                            Durability
                        </label>

                        <label for="ease-of-use">
                            <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                            Ease of Use
                        </label>

                        <label for="performance">
                            <input type="checkbox" id="performance" name="features" value="performance">
                            Performance
                        </label>

                        <label for="design">
                            <input type="checkbox" id="design" name="features" value="design">
                            Design
                        </label>

                    </div>


                </div>


                <!-- Written Review -->
                <div>
                    <label for="text-message">
                        Written Review <span>(Optional)</span>
                    </label>

                    <textarea name="review" id="text-message"></textarea>
                </div>


                <!-- Name -->
                <div class="name">

                    <label for="user-name">
                        Your Name <span>(Optional)</span>
                    </label>

                    <input type="text" name="user-name" id="user-name">

                </div>


                <!-- Submit -->
                <div>
                    <input type="submit" value="Post Review">
                </div>

            </form>

        </main>


        <footer>
            <p>
                <span id="currentyear"></span>
                🌺 Oluoch Maxwel Ochieng 🌺 Kenya
            </p>

            <p>
                <span id="lastModified"></span>
            </p>
        </footer>

    </div>
   

</body>

</html>
